<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aperture — A Photo Gallery</title>
<style>
  :root{
    --ink:#0B1E33;
    --paper:#DCEEFB;
    --paper-dim:#BFE0F5;
    --gold:#4FB8F0;
    --teal:#1E5FA8;
    --line: rgba(220,238,251,0.14);
    --font-display: 'Fraunces', Georgia, 'Iowan Old Style', serif;
    --font-ui: 'Work Sans', 'Helvetica Neue', Arial, sans-serif;
  }

  @font-face{
    font-family:'Fraunces';
    src: local('Fraunces');
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    padding:0;
    background:var(--ink);
    color:var(--paper);
    font-family:var(--font-ui);
    -webkit-font-smoothing:antialiased;
  }

  body{
    min-height:100vh;
  }

  ::selection{ background:var(--gold); color:var(--ink); }

  header.site{
    padding: 4.5rem 6vw 2.5rem;
    border-bottom:1px solid rgba(220,238,251,0.12);
  }

  .kicker{
    font-size:0.78rem;
    letter-spacing:0.02em;
    color:var(--gold);
    margin:0 0 0.9rem;
  }

  h1.title{
    font-family:var(--font-display);
    font-weight:600;
    font-size:clamp(2.4rem, 5.5vw, 4.6rem);
    line-height:1.02;
    margin:0 0 1rem;
    max-width:14ch;
  }

  p.lede{
    font-size:1.02rem;
    line-height:1.6;
    max-width:46ch;
    color:rgba(220,238,251,0.72);
    margin:0;
  }

  /* Filter bar */
  nav.filters{
    display:flex;
    flex-wrap:wrap;
    gap:1.8rem;
    padding: 1.7rem 6vw;
    border-bottom:1px solid rgba(220,238,251,0.12);
    position:sticky;
    top:0;
    background:rgba(22,21,15,0.92);
    backdrop-filter:blur(10px);
    z-index:20;
  }

  .filter-btn{
    background:none;
    border:none;
    font-family:var(--font-ui);
    font-size:0.95rem;
    color:rgba(220,238,251,0.5);
    cursor:pointer;
    padding:0.3rem 0;
    position:relative;
    transition: color 0.25s ease;
  }

  .filter-btn::after{
    content:"";
    position:absolute;
    left:0; bottom:-2px;
    width:100%;
    height:2px;
    background:var(--gold);
    transform:scaleX(0);
    transform-origin:left;
    transition: transform 0.3s ease;
  }

  .filter-btn:hover{ color:var(--paper); }

  .filter-btn.active{ color:var(--paper); }
  .filter-btn.active::after{ transform:scaleX(1); }

  .filter-count{
    margin-left:6vw;
    font-size:0.82rem;
    color:rgba(220,238,251,0.4);
    align-self:center;
  }

  /* Gallery grid */
  main.gallery{
    padding: 2.6rem 6vw 5rem;
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    grid-auto-rows: 12px;
    gap: 1.1rem;
  }

  figure.tile{
    margin:0;
    position:relative;
    overflow:hidden;
    border-radius:2px;
    cursor:zoom-in;
    background:var(--paper-dim);
    opacity:0;
    transform: translateY(14px);
    animation: rise 0.6s ease forwards;
  }

  @keyframes rise{
    to{ opacity:1; transform:translateY(0); }
  }

  figure.tile img{
    width:100%;
    height:100%;
    display:block;
    object-fit:cover;
    transition: transform 0.7s cubic-bezier(.2,.7,.2,1), filter 0.5s ease;
    filter: grayscale(18%) contrast(1.02);
  }

  figure.tile:hover img{
    transform: scale(1.06);
    filter:grayscale(0%) contrast(1.05);
  }

  figure.tile .tile-info{
    position:absolute;
    left:0; right:0; bottom:0;
    padding: 1.6rem 1.2rem 1rem;
    background:linear-gradient(to top, rgba(11,30,51,0.85), rgba(11,30,51,0));
    transform: translateY(100%);
    transition: transform 0.4s cubic-bezier(.2,.7,.2,1);
  }

  figure.tile:hover .tile-info{ transform: translateY(0); }

  .tile-info .tile-cat{
    font-size:0.7rem;
    color:var(--gold);
    margin:0 0 0.2rem;
  }

  .tile-info .tile-name{
    font-family:var(--font-display);
    font-size:1.05rem;
    margin:0;
    color:var(--paper);
  }

  /* Size variety for a magazine-style rhythm */
  figure.tile.size-a{ grid-column: span 2; grid-row: span 26; }
  figure.tile.size-b{ grid-column: span 2; grid-row: span 34; }
  figure.tile.size-c{ grid-column: span 1; grid-row: span 20; }

  figure.tile.hide{ display:none; }

  /* Lightbox */
  .lightbox{
    position:fixed;
    inset:0;
    background:rgba(11,30,51,0.97);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:100;
    opacity:0;
    pointer-events:none;
    transition: opacity 0.35s ease;
  }

  .lightbox.open{ opacity:1; pointer-events:auto; }

  .lightbox-frame{
    max-width:84vw;
    max-height:82vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:1rem;
    transform: scale(0.97);
    transition: transform 0.35s ease;
  }

  .lightbox.open .lightbox-frame{ transform:scale(1); }

  .lightbox img{
    max-width:84vw;
    max-height:70vh;
    object-fit:contain;
    border-radius:2px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.6);
  }

  .lightbox-caption{
    text-align:center;
  }

  .lightbox-caption .tile-cat{ font-size:0.72rem; color:var(--gold); }
  .lightbox-caption .tile-name{
    font-family:var(--font-display);
    font-size:1.3rem;
    margin:0.2rem 0 0;
  }

  .lb-btn{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    background:rgba(220,238,251,0.06);
    border:1px solid rgba(220,238,251,0.25);
    color:var(--paper);
    width:48px; height:48px;
    border-radius:50%;
    font-size:1.3rem;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition: background 0.25s ease, border-color 0.25s ease;
  }

  .lb-btn:hover{ background:rgba(220,238,251,0.16); border-color:var(--gold); }

  .lb-prev{ left:3vw; }
  .lb-next{ right:3vw; }

  .lb-close{
    position:absolute;
    top:2.2rem; right:3vw;
    background:none;
    border:none;
    color:var(--paper);
    font-size:1.6rem;
    cursor:pointer;
    line-height:1;
    padding:0.4rem;
  }

  .lb-close:hover{ color:var(--gold); }

  .lb-index{
    position:absolute;
    top:2.4rem; left:3vw;
    font-size:0.82rem;
    color:rgba(220,238,251,0.5);
    letter-spacing:0.02em;
  }

  /* Responsive */
  @media (max-width: 980px){
    main.gallery{ grid-template-columns: repeat(2, 1fr); }
    figure.tile.size-a, figure.tile.size-b{ grid-column: span 2; grid-row: span 24; }
    figure.tile.size-c{ grid-column: span 1; grid-row: span 18; }
    .filter-count{ margin-left:0; width:100%; order:10; }
  }

  @media (max-width: 620px){
    header.site{ padding: 3rem 6vw 2rem; }
    nav.filters{ gap:1.1rem; padding:1.2rem 6vw; }
    main.gallery{ grid-template-columns: 1fr; padding: 1.8rem 6vw 3.5rem; gap:1rem; }
    figure.tile.size-a, figure.tile.size-b, figure.tile.size-c{
      grid-column: span 1; grid-row: span 220px;
      height: 62vw;
    }
    .lb-prev{ left:2vw; width:40px; height:40px; }
    .lb-next{ right:2vw; width:40px; height:40px; }
    .lb-close{ top:1.2rem; right:4vw; }
    .lb-index{ top:1.4rem; left:4vw; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.01ms !important; transition-duration:0.01ms !important; }
  }

  .visually-hidden{
    position:absolute; width:1px; height:1px;
    overflow:hidden; clip:rect(0,0,0,0);
  }

  button:focus-visible, .filter-btn:focus-visible{
    outline:2px solid var(--gold);
    outline-offset:3px;
  }
</style>
</head>
<body>

<header class="site">
  <p class="kicker">Aperture / Field Notes, No. 04</p>
  <h1 class="title">Twenty frames from the last four seasons</h1>
  <p class="lede">A working set pulled from the archive — coastline, concrete, faces, and the odd shape that didn't fit anywhere else. Sorted loosely, shot slowly.</p>
</header>

<nav class="filters" id="filters">
  <button class="filter-btn active" data-filter="all">All work</button>
  <button class="filter-btn" data-filter="landscape">Landscape</button>
  <button class="filter-btn" data-filter="urban">Urban</button>
  <button class="filter-btn" data-filter="portrait">Portrait</button>
  <button class="filter-btn" data-filter="abstract">Abstract</button>
  <span class="filter-count" id="filterCount"></span>
</nav>

<main class="gallery" id="gallery"></main>

<div class="lightbox" id="lightbox">
  <button class="lb-close" id="lbClose" aria-label="Close">&times;</button>
  <span class="lb-index" id="lbIndex"></span>
  <button class="lb-btn lb-prev" id="lbPrev" aria-label="Previous image">&#8249;</button>
  <div class="lightbox-frame">
    <img id="lbImage" src="" alt="">
    <div class="lightbox-caption">
      <p class="tile-cat" id="lbCat"></p>
      <p class="tile-name" id="lbName"></p>
    </div>
  </div>
  <button class="lb-btn lb-next" id="lbNext" aria-label="Next image">&#8250;</button>
</div>

<script>
  const photos = [
    { id: 1018, cat: 'landscape', name: 'Ridgeline, first light',      size:'a' },
    { id: 1036, cat: 'landscape', name: 'Fog over the pass',           size:'c' },
    { id: 1043, cat: 'landscape', name: 'Low tide, salt flats',        size:'b' },
    { id: 1015, cat: 'landscape', name: 'River bend, late autumn',     size:'c' },
    { id: 1015, cat: 'landscape', name: 'Glacial valley',              size:'c', seed:1 },

    { id: 1067, cat: 'urban',     name: 'Stairwell, west block',       size:'b' },
    { id: 1074, cat: 'urban',     name: 'Awning study',                size:'c' },
    { id: 1078, cat: 'urban',     name: 'Night market, wet street',    size:'a' },
    { id: 164,  cat: 'urban',     name: 'Parking structure, noon',     size:'c' },

    { id: 64,   cat: 'portrait',  name: 'M., workshop light',          size:'b' },
    { id: 91,   cat: 'portrait',  name: 'Portrait with window',        size:'c' },
    { id: 177,  cat: 'portrait',  name: 'After the shift',             size:'a' },
    { id: 1005, cat: 'portrait',  name: 'Two chairs',                  size:'c' },

    { id: 128,  cat: 'abstract',  name: 'Rust and grid',               size:'c' },
    { id: 145,  cat: 'abstract',  name: 'Water, overexposed',          size:'b' },
    { id: 219,  cat: 'abstract',  name: 'Folded tarpaulin',            size:'c' },
    { id: 1069, cat: 'abstract',  name: 'Static, unedited',            size:'a' },
  ];

  const galleryEl = document.getElementById('gallery');
  const filterCountEl = document.getElementById('filterCount');
  let currentFilter = 'all';
  let visibleList = [];
  let currentIndex = 0;

  function imgUrl(p, w, h){
    return `https://picsum.photos/id/${p.id}/${w}/${h}`;
  }

  function catLabel(cat){
    return cat.charAt(0).toUpperCase() + cat.slice(1);
  }

  function renderGallery(){
    galleryEl.innerHTML = '';
    photos.forEach((p, i) => {
      const fig = document.createElement('figure');
      fig.className = `tile size-${p.size}`;
      fig.dataset.cat = p.cat;
      fig.dataset.index = i;
      fig.style.animationDelay = `${(i % 8) * 0.05}s`;

      const img = document.createElement('img');
      img.src = imgUrl(p, 700, 900);
      img.alt = p.name;
      img.loading = 'lazy';

      const info = document.createElement('div');
      info.className = 'tile-info';
      info.innerHTML = `<p class="tile-cat">${catLabel(p.cat)}</p><p class="tile-name">${p.name}</p>`;

      fig.appendChild(img);
      fig.appendChild(info);
      fig.addEventListener('click', () => openLightbox(i));

      galleryEl.appendChild(fig);
    });
    applyFilter(currentFilter);
  }

  function applyFilter(filter){
    currentFilter = filter;
    const tiles = Array.from(galleryEl.children);
    visibleList = [];
    tiles.forEach((tile) => {
      const match = filter === 'all' || tile.dataset.cat === filter;
      tile.classList.toggle('hide', !match);
      if (match) visibleList.push(Number(tile.dataset.index));
    });
    filterCountEl.textContent = `${visibleList.length} image${visibleList.length !== 1 ? 's' : ''}`;
  }

  document.getElementById('filters').addEventListener('click', (e) => {
    const btn = e.target.closest('.filter-btn');
    if (!btn) return;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    applyFilter(btn.dataset.filter);
  });

  // Lightbox
  const lightbox = document.getElementById('lightbox');
  const lbImage = document.getElementById('lbImage');
  const lbCat = document.getElementById('lbCat');
  const lbName = document.getElementById('lbName');
  const lbIndexEl = document.getElementById('lbIndex');

  function openLightbox(photoIndex){
    currentIndex = visibleList.indexOf(photoIndex);
    if (currentIndex === -1) currentIndex = 0;
    showLightboxImage();
    lightbox.classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function showLightboxImage(){
    const p = photos[visibleList[currentIndex]];
    lbImage.src = imgUrl(p, 1400, 1000);
    lbImage.alt = p.name;
    lbCat.textContent = catLabel(p.cat);
    lbName.textContent = p.name;
    lbIndexEl.textContent = `${currentIndex + 1} / ${visibleList.length}`;
  }

  function closeLightbox(){
    lightbox.classList.remove('open');
    document.body.style.overflow = '';
  }

  function showNext(){
    currentIndex = (currentIndex + 1) % visibleList.length;
    showLightboxImage();
  }

  function showPrev(){
    currentIndex = (currentIndex - 1 + visibleList.length) % visibleList.length;
    showLightboxImage();
  }

  document.getElementById('lbClose').addEventListener('click', closeLightbox);
  document.getElementById('lbNext').addEventListener('click', showNext);
  document.getElementById('lbPrev').addEventListener('click', showPrev);

  lightbox.addEventListener('click', (e) => {
    if (e.target === lightbox) closeLightbox();
  });

  document.addEventListener('keydown', (e) => {
    if (!lightbox.classList.contains('open')) return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowRight') showNext();
    if (e.key === 'ArrowLeft') showPrev();
  });

  renderGallery();
</script>
</body>
</html>
